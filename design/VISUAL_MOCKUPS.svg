371 367A104 104 0 0 1 475 263Z" fill="#37b9ef"/><circle cx="475" cy="367" r="42" fill="#fff8e6" stroke="white" stroke-width="5"/><text x="475" y="383" text-anchor="middle" class="heading" style="fill:#873d56">5</text><g transform="translate(293 477)"><use href="#card" style="color:#e83b4e"/><text x="36" y="72" class="card-number">7</text><g transform="translate(57 0)"><use href="#card" style="color:#f7c92f"/><text x="36" y="72" class="card-number">9</text></g><g transform="translate(114 0)"><use href="#card" style="color:#48d769"/><text x="36" y="72" class="card-number">0</text></g><g transform="translate(171 0)"><use href="#card" style="color:#37b6ee"/><text x="36" y="72" class="card-number">2</text></g></g><rect x="947" y="20" width="309" height="672" rx="30" fill="url(#coral)" stroke="#fff6d9" stroke-width="7" filter="url(#shadow)"/><text x="974" y="73" class="heading">HÀNH ĐỘNG</text><text x="973" y="119" class="body">Chọn lá sáng hoặc rút bài.</text><rect x="975" y="149" width="252" height="63" rx="31" fill="url(#blue)" stroke="white" stroke-width="4"/><text x="1101" y="190" class="button-text">RÚT BÀI</text><rect x="975" y="231" width="252" height="63" rx="31" fill="url(#gold)" stroke="white" stroke-width="4"/><text x="1101" y="272" class="button-text" style="fill:#78404b">? LUẬT CHƠI</text><rect x="975" y="577" width="252" height="63" rx="31" fill="url(#coral)" stroke="white" stroke-width="4"/><text x="1101" y="618" class="button-text">← THƯ VIỆN</text></g>

<!-- Fusion Lab -->
<g transform="translate(0 2160)"><rect width="1280" height="720" fill="url(#purple)"/><rect width="1280" height="720" fill="url(#rays)"/><rect x="24" y="20" width="1232" height="672" rx="40" fill="none" stroke="#fff6d7" stroke-width="8"/><text x="640" y="98" text-anchor="middle" class="logo">FUSION LAB</text><text x="640" y="132" text-anchor="middle" class="body">CHỌN HAI GAME. KHÁM PHÁ MỘT CUỘC VUI MỚI.</text><g filter="url(#shadow)"><path d="M146 530V290C146 206 213 174 295 174C377 174 444 206 444 290V530Q444 568 402 568H188Q146 568 146 530Z" fill="url(#coral)" stroke="#fff4cf" stroke-width="11"/><path d="M836 530V290C836 206 903 174 985 174C1067 174 1134 206 1134 290V530Q1134 568 1092 568H878Q836 568 836 530Z" fill="url(#coral)" stroke="#fff4cf" stroke-width="11"/></g><text x="295" y="223" text-anchor="middle" class="mini">GAME A</text><text x="985" y="223" text-anchor="middle" class="mini">GAME B</text><rect x="207" y="278" width="176" height="170" rx="34" fill="url(#teal)" stroke="white" stroke-width="9" filter="url(#shadow)"/><text x="295" y="393" text-anchor="middle" class="logo">♚</text><rect x="897" y="278" width="176" height="170" rx="34" fill="url(#red)" stroke="white" stroke-width="9" filter="url(#shadow)"/><text x="985" y="393" text-anchor="middle" class="logo">▣</text><rect x="210" y="487" width="170" height="52" rx="25" fill="url(#blue)" stroke="white" stroke-width="4"/><text x="295" y="522" class="button-text">CHESS</text><rect x="880" y="487" width="210" height="52" rx="25" fill="url(#blue)" stroke="white" stroke-width="4"/><text x="985" y="522" class="button-text">COLOR CLASH</text><circle cx="640" cy="369" r="137" fill="#fff6bd" stroke="white" stroke-width="9" filter="url(#shadow)"/><circle cx="640" cy="369" r="112" fill="url(#gold)"/><text x="640" y="380" text-anchor="middle" class="logo" style="fill:#d44475">✦</text><rect x="547" y="424" width="186" height="60" rx="30" fill="url(#gold)" stroke="white" stroke-width="5" filter="url(#shadow)"/><tex