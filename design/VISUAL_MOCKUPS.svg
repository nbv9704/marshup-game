<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 2880" width="1280" height="2880" role="img" aria-label="Mashup Arena visual mockups: main menu, lobby, Color Clash table and Fusion Lab">
<defs>
  <radialGradient id="red"><stop stop-color="#ffb566"/><stop offset=".55" stop-color="#e94a48"/><stop offset="1" stop-color="#862044"/></radialGradient>
  <radialGradient id="teal"><stop stop-color="#8af5eb"/><stop offset=".58" stop-color="#168ba6"/><stop offset="1" stop-color="#174a78"/></radialGradient>
  <radialGradient id="purple"><stop stop-color="#ffe3ad"/><stop offset=".34" stop-color="#d462c0"/><stop offset="1" stop-color="#4e2a89"/></radialGradient>
  <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff9b4"/><stop offset=".55" stop-color="#ffd260"/><stop offset="1" stop-color="#f4a53d"/></linearGradient>
  <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#a7f5ff"/><stop offset=".55" stop-color="#42bce8"/><stop offset="1" stop-color="#1888c8"/></linearGradient>
  <linearGradient id="green" x2="0" y2="1"><stop stop-color="#c5ff9a"/><stop offset=".55" stop-color="#66df79"/><stop offset="1" stop-color="#24b35d"/></linearGradient>
  <linearGradient id="coral" x2="0" y2="1"><stop stop-color="#ffb98c"/><stop offset=".55" stop-color="#f2745f"/><stop offset="1" stop-color="#d6455a"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#551538" flood-opacity=".55"/></filter>
  <pattern id="rays" width="1280" height="720" patternUnits="userSpaceOnUse"><rect width="1280" height="720" fill="none"/><path d="M640 360L-50 -30h130L640 360M640 360L115 -30h130L640 360M640 360L440 -30h130L640 360M640 360L765 -30h130L640 360M640 360L1090 -30h130L640 360M640 360L1330 90v95L640 360M640 360L1330 530v100L640 360M640 360L1050 750h-120L640 360M640 360L700 750H580L640 360M640 360L370 750H250L640 360M640 360L20 750h-100L640 360" fill="#fff" opacity=".07"/></pattern>
  <g id="mascot"><path d="M-25 -15L-38 -56L-8 -34M25 -15L38 -56L8 -34" fill="#ffbd56" stroke="#662e51" stroke-width="4"/><ellipse rx="42" ry="45" fill="#ffbe66" stroke="#662e51" stroke-width="5"/><ellipse cx="-14" cy="-2" rx="4" ry="6" fill="#382438"/><ellipse cx="14" cy="-2" rx="4" ry="6" fill="#382438"/><path d="M-9 13Q0 22 9 13" fill="none" stroke="#662e51" stroke-width="4" stroke-linecap="round"/><ellipse cx="-23" cy="9" rx="6" ry="3" fill="#fb7c8f"/><ellipse cx="23" cy="9" rx="6" ry="3" fill="#fb7c8f"/><ellipse cx="-18" cy="-21" rx="13" ry="5" fill="#fff" opacity=".48" transform="rotate(-25 -18 -21)"/></g>
  <g id="card"><rect x="0" y="6" width="73" height="112" rx="16" fill="#67264c" opacity=".55"/><rect x="0" y="0" width="73" height="112" rx="16" fill="currentColor" stroke="#fff8e5" stroke-width="7"/><ellipse cx="36" cy="55" rx="21" ry="34" fill="none" stroke="#fff9df" stroke-width="3" transform="rotate(30 36 55)"/></g>
  <g id="seat"><rect x="0" y="4" width="205" height="62" rx="18" fill="#1b709b"/><rect x="0" y="0" width="205" height="62" rx="18" fill="url(#blue)" stroke="#fff6e0" stroke-width="5"/><circle cx="34" cy="30" r="28" fill="url(#gold)" stroke="#fff7df" stroke-width="5"/><text x="82" y="33" class="seat-text">PLAYER</text><text x="82" y="49" class="seat-sub">LOCAL</text></g>
</defs>
<style>.title{font:bold 51px Fredoka,Arial,sans-serif;fill:#fffdf2;paint-order:stroke;stroke:#8e2b50;stroke-width:5}.logo{font:bold 64px Fredoka,Arial,sans-serif;fill:#fffdf2;paint-order:stroke;stroke:#812a4d;stroke-width:7}.heading{font:bold 33px Fredoka,Arial,sans-serif;fill:#fff9ea;paint-order:stroke;stroke:#8a2b4e;stroke-width:3}.body{font:600 20px Fredoka,Arial,sans-serif;fill:#fff8e9}.mini{font:bold 14px Fredoka,Arial,sans-serif;fill:#fff5d8;letter-spacing:2px}.seat-text{font:bold 19px Fredoka,Arial,sans-serif;fill:#fff}.seat-sub{font:bold 11px Fredoka,Arial,sans-serif;fill:#eaffff}.button-text{font:bold 22px Fredoka,Arial,sans-serif;fill:#fff;text-anchor:middle}.card-number{font:bold 62px Fredoka,Arial,sans-serif;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#74405d;stroke-width:3}.tiny{font:bold 12px Fredoka,Arial,sans-serif;fill:#fff3d9}</style>

<!-- Main menu -->
<g transform="translate(0 0)"><rect width="1280" height="720" fill="url(#red)"/><rect width="1280" height="720" fill="url(#rays)"/><rect width="105" height="720" fill="#c3354d" stroke="#ffcf99" stroke-width="4"/><rect x="128" y="18" width="1128" height="74" rx="21" fill="#ce3e54" stroke="#fff2cc" stroke-width="4"/><text x="157" y="67" class="heading">✦ MASHUP ARENA</text><rect x="995" y="36" width="108" height="42" rx="21" fill="url(#gold)" stroke="#fff" stroke-width="4"/><text x="1019" y="65" class="body" fill="#69364b">◈ 1,000</text><rect x="1130" y="36" width="105" height="42" rx="21" fill="url(#blue)" stroke="#fff" stroke-width="4"/><text x="1151" y="65" class="body">LV 1</text><rect x="130" y="116" width="1124" height="465" rx="40" fill="url(#red)" stroke="#fff2ce" stroke-width="7" filter="url(#shadow)"/><rect x="130" y="116" width="1124" height="465" rx="40" fill="url(#rays)"/><text x="183" y="191" class="mini">ARCADE NGOẠI TUYẾN  /  PARTY EDITION</text><text x="183" y="265" class="logo">✦ MASHUP <tspan fill="#ffe36d">ARENA</tspan></text><text x="183" y="325" class="heading">MỘT ĐẤU TRƯỜNG.</text><text x="183" y="367" class="heading">VÔ VÀN KHẢ NĂNG.</text><text x="185" y="411" class="body">Bảy game ngoại tuyến. Những cuộc đối đầu đầy màu sắc.</text><rect x="184" y="451" width="214" height="68" rx="34" fill="url(#green)" stroke="white" stroke-width="5" filter="url(#shadow)"/><text x="291" y="493" class="button-text">▶ CHƠI NGAY</text><rect x="422" y="451" width="206" height="68" rx="34" fill="url(#blue)" stroke="white" stroke-width="5" filter="url(#shadow)"/><text x="525" y="493" class="button-text">THƯ VIỆN ↗</text><g transform="translate(952 360) scale(1.8)" filter="url(#shadow)"><use href="#mascot"/></g><g transform="translate(1095 409) scale(1.25)" filter="url(#shadow)"><use href="#mascot"/></g><text x="144" y="650" class="heading">SẴN SÀNG VÀO BÀN</text><text x="146" y="685" class="body">Chess  •  Color Clash  •  Blackjack  •  Slots  •  Ludo  •  Xiangqi</text><text x="29" y="150" class="mini">HOME</text><text x="29" y="256" class="mini">GAMES</text><text x="29" y="362" class="mini">PROFILE</text><text x="29" y="468" class="mini">SETTINGS</text></g>

<!-- Lobby -->
<g transform="translate(0 720)"><rect width="1280" height="720" fill="url(#red)"/><rect width="1280" height="720" fill="url(#rays)"/><rect width="105" height="720" fill="#c3354d" stroke="#ffcf99" stroke-width="4"/><rect x="128" y="18" width="1128" height="74" rx="21" fill="#ce3e54" stroke="#fff2cc" stroke-width="4"/><text x="156" y="66" class="heading">✦ MASHUP ARENA / LIBRARY</text><text x="139" y="150" class="title">CHỌN CUỘC VUI</text><rect x="138" y="169" width="366" height="52" rx="26" fill="#fff5dd" stroke="white" stroke-width="4"/><text x="162" y="202" class="body" style="fill:#94526a">⌕  Tìm game...</text><g transform="translate(530 169)"><rect width="136" height="52" rx="26" fill="url(#gold)" stroke="white" stroke-width="4"/><text x="68" y="33" class="button-text" style="fill:#804251">TẤT CẢ</text><rect x="146" width="136" height="52" rx="26" fill="url(#blue)" stroke="white" stroke-width="4"/><text x="214" y="33" class="button-text">BÀN CỜ</text><rect x="292" width="136" height="52" rx="26" fill="url(#coral)" stroke="white" stroke-width="4"/><text x="360" y="33" class="button-text">BÀI LÁ</text><rect x="438" width="136" height="52" rx="26" fill="url(#blue)" stroke="white" stroke-width="4"/><text x="506" y="33" class="button-text">CASINO</text></g><g filter="url(#shadow)"><g transform="translate(139 252)"><rect width="249" height="185" rx="27" fill="url(#teal)" stroke="white" stroke-width="6"/><rect x="16" y="15" width="98" height="28" rx="14" fill="url(#gold)" stroke="white" stroke-width="2"/><text x="30" y="35" class="tiny" style="fill:#703e4a">CHƠI NGAY</text><text x="125" y="121" text-anchor="middle" class="logo">♚</text><text x="23" y="160" class="body">Chess  ·  2P</text></g><g transform="translate(421 252)"><rect width="249" height="185" rx="27" fill="url(#red)" stroke="white" stroke-width="6"/><rect x="16" y="15" width="98" height="28" rx="14" fill="url(#gold)" stroke="white" stroke-width="2"/><text x="30" y="35" class="tiny" style="fill:#703e4a">CHƠI NGAY</text><text x="125" y="121" text-anchor="middle" class="logo">▣</text><text x="23" y="160" class="body">Color Clash  ·  2P</text></g><g transform="translate(703 252)"><rect width="249" height="185" rx="27" fill="url(#purple)" stroke="white" stroke-width="6"/><rect x="16" y="15" width="98" height="28" rx="14" fill="url(#gold)" stroke="white" stroke-width="2"/><text x="30" y="35" class="tiny" style="fill:#703e4a">CHƠI NGAY</text><text x="125" y="121" text-anchor="middle" class="logo">21</text><text x="23" y="160" class="body">Blackjack  ·  1P</text></g><g transform="translate(985 252)"><rect width="249" height="185" rx="27" fill="url(#purple)" stroke="white" stroke-width="6"/><rect x="16" y="15" width="98" height="28" rx="14" fill="url(#gold)" stroke="white" stroke-width="2"/><text x="30" y="35" class="tiny" style="fill:#703e4a">CHƠI NGAY</text><text x="125" y="121" text-anchor="middle" class="logo">777</text><text x="23" y="160" class="body">Neon Reels  ·  1P</text></g></g><text x="140" y="501" class="heading">KHÁM PHÁ THÊM</text><text x="140" y="547" class="body">38 game trong danh mục thiết kế. Game đã hoàn thiện có nút Chơi ngay.</text><rect x="139" y="576" width="1095" height="95" rx="23" fill="#e75160" stroke="#fff1d8" stroke-width="5"/><text x="168" y="635" class="body">♟ Board  14         ♠ Card  12         ◆ Casino  12         ♥ Favorites</text></g>

<!-- Gameplay -->
