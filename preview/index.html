const translations={vi:{home:'Sảnh chính',library:'Thư viện',trainer:'Chơi thử',profile:'Hồ sơ',settings:'Cài đặt',
play:'CHƠI TRIPLE SPARK',explore:'XEM THƯ VIỆN',notice:'Bản xem thử HTML hoạt động độc lập. Không phải bản Electron/PixiJS.',
hero:'MỘT ĐẤU TRƯỜNG. VÔ VÀN KHẢ NĂNG.',body:'38 thiết kế game đang được xây dựng. Triple Spark là trò luyện tập đã có luật chơi.',
search:'Tìm game...',favorites:'Yêu thích',all:'Tất cả',board:'Bàn cờ',card:'Bài lá',casino:'Casino',bot:'Đấu bot',hotseat:'2 người tại máy',new:'Ván mới',

en:{home:'Lobby',library:'Library',trainer:'Trainer',profile:'Profile',settings:'Settings',play:'PLAY TRIPLE SPARK',explore:'EXPLORE LIBRARY',
notice:'Standalone interactive HTML review. Not the packaged Electron/PixiJS app.',hero:'ONE ARENA. INFINITE POSSIBILITIES.',
body:'Explore 38 planned games. Triple Spark is the playable rule-engine trainer.',search:'Search games...',favorites:'Favorites',all:'All',board:'Board',card:'Cards',casino:'Casino',
bot:'Versus bot',hotseat:'Hotseat',new:'New match',setting:'Settings',name:'Display name',save:'Save',language:'Language',mute:'Mute audio',contrast:'High contrast',status:'Saved offline'}};
const icons={chess:'♚',xiangqi:'帥',go:'◉',gomoku:'✣',ludo:'♟',property:'◆',checkers:'◈',othello:'◑',backgammon:'⚄',snakes:'↝',connect4:'●',tictactoe:'✕',
mancala:'◐',dominoes:'▦',uno:'▣',tienlen:'♠',phom:'♣',maubinh:'♢',holdem:'♥',bridge:'♧',hearts:'♥',solitaire:'♤',crazyeights:'⑧',cheat:'?',memory:'▤',xidach:'♠',
blackjack:'21',slots:'777',roulette:'◉',baccarat:'♠',craps:'⚄',videopoker:'♢',sicbo:'⚅',keno:'10',plinko:'⋮',dice:'⚂',wheel:'✦',scratch:'▧'};
const initial={profile:{name:'PLAYER ONE',avatar:'☄',chips:1000,xp:0,favs:[]},settings:{locale:'vi',muted:false,contrast:false},match:null};
let data;try{data=JSON.parse(localStorage.getItem('mashup-preview-p2'))||initial;}catch{data=structuredClone(initial)}
if(!data.profile||!data.settings)data=structuredClone(initial);
let route='home',category='all',query='',detail=null;
const txt=k=>translations[data.settings.locale][k]||k;
function persist(){try{localStorage.setItem('mashup-preview-p2',JSON.stringify(data));}catch{}}
function go(to){route=to;detail=null;render();}
function toggle(id){const a=data.profile.favs;data.profile.favs=a.includes(id)?a.filter(x=>x!==id):[...a,id];persist();render();}
function newMatch(mode){data.match={mode,cells:Array(9).fill(null),turn:'x',winner:null,history:[]};persist();render();}
const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function win(a){for(const line of lines){const t=a[line[0]];if(t&&line.every(i=>a[i]===t))return t;}return a.every(Boolean)?'draw':null}
function bot(a){const empty=a.map((v,i)=>v===null?i:-1).filter(i=>i>=0);
 const tactical=t=>empty.find(i=>{const copy=a.slice();copy[i]=t;return win(copy)===t;});
 return tactical('o')??tactical('x')??(empty.includes(4)?4:empty[0]);}
function move(i){const m=data.match;if(!m||m.winner||m.cells[i]||(m.mode==='bot'&&m.turn==='o'))return;
 m.history.push(m.cells.slice());m.cells[i]=m.turn;m.winner=win(m.cells);m.turn=m.turn==='x'?'o':'x';
 if(!m.winner&&m.mode==='bot'){const b=bot(m.cells);m.history.push(m.cells.slice());m.cells[b]='o';m.winner=win(m.cells);m.turn='x';}
 if(m.winner){data.profile.xp+=m.winner==='x'?65:20;data.profile.chips+=m.winner==='x'?30:5;}
 persist();render();}
function undo(){const m=data.match;if(!m||!m.history.length||m.winner)return;
 const steps=m.mode==='bot'&&m.history.length>=2?2:1;
 m.cells=m.history[m.history.length-steps];m.history=m.history.slice(0,-steps);
 m.turn=m.cells.filter(Boolean).length%2===0?'x':'o';persist();render();}
function selectCategory(c){category=c;query='';render();}
function setQuery(q){query=q;const cursorPos=document.getElementById('search-input')?.selectionStart;render();const input=document.getElementById('search-input');if(input){input.focus();input.setSelectionRange(cursorPos,cursorPos);}}
function cards(items){return '<div class="game-grid">'+items.map(g=>`<article class="game-tile type-${g.category}"><div class="tile-top"><span class="small-badge">${g.category.toUpperCase()}</span>
 <button class="favorite ${data.profile.favs.includes(g.id)?'active':''}" onclick="toggle('${g.id}')">${data.profile.favs.includes(g.id)?'♥':'♡'}</button></div>
 <button class="tile-interior" onclick="detail='${g.id}';render()"><span class="tile-glyph">${icons[g.id]||'✦'}</span><b class="tile-title">${g.name.replaceAll('&','&amp;')}</b>
 <small class="tile-tags">${g.tags.slice(0,2).join(' · ')}</small></button></article>`).join('')+'</div>';}
function content(){if(route==='home')return `<section class="hero"><div class="hero-aura"></div><div class="hero-content"><span class="eyebrow">✦ OFFLINE ARCADE // VERSION 0.1</span>
 <h1>${txt('hero')}</h1><p>${txt('body')}</p><div class="button-row"><button class="button primary large" onclick="go('trainer')">✦ ${txt('play')}</button>
 <button class="button outline large" onclick="go('library')">${txt('explore')} ↗</button></div><p class="preview-info">${txt('notice')}</p></div>
 <div class="floating-card"><span class="float-icon">✕</span><span class="float-divider">VS</span><span class="float-icon lilac">◯</span><div class="float-caption">TRIPLE<br>SPARK</div></div></section>
 <div class="section-heading"><div><span class="eyebrow">READY TO PLAY</span><h2>TRIPLE SPARK</h2></div></div>
 <div class="feature-row"><button class="featured-game" onclick="go('trainer')"><span class="triple-icon">✕ <i>◯</i> ✕</span><span class="featured-title">TRIPLE SPARK</span>
 <span class="feature-sub">MATCH / BOT / HOTSEAT</span><span class="play-disc">↗</span></button><div class="feature-meta panel"><span class="eyebrow">38 DESIGN BLUEPRINTS</span>
 <h3>${txt('explore')}</h3><p>${txt('body')}</p><div class="category-preview">${['board','card','casino'].map(c=>`<button onclick="category='${c}';go('library')"><span>${c==='board'?'♟':c==='card'?'♠':'◆'}</span><b>${txt(c)}</b><small>${catalog.filter(g=>g.category===c).length} GAMES</small></button>`).join('')}</div></div></div>`;
 if(route==='library'){
  const visible=catalog.filter(g=>(category==='all'||(category==='favorites'?data.profile.favs.includes(g.id):g.category===category))&&(g.name.toLowerCase().includes(query.toLowerCase())||g.tags.some(t=>t.includes(query.toLowerCase()))));
  return `<div class="section-heading"><div><span class="eyebrow">DISCOVERY / DESIGN CATALOG</span><h1>${txt('library')}</h1></div><span class="counter-badge">${visible.length} / 38</span></div>
  <div class="catalog-tools"><div class="search-wrap"><span>⌕</span><input id="search-input" placeholder="${txt('search')}" value="${query.replaceAll('"','&quot;')}" oninput="setQuery(this.value)"></div>
  <div class="filter-list">${['all','board','card','casino','favorites'].map(c=>`<button class="filter ${category===c?'selected':''}" onclick="selectCategory('${c}')">${txt(c)}</button>`).join('')}</div></div>
  <p class="preview-info">${txt('notice')}</p>${cards(visible)}`;}
 if(route==='trainer'){
  const m=data.match;return `<div class="section-heading"><div><span class="eyebrow">RULES ENGINE • FIRST VERTICAL SLICE</span><h1>TRIPLE SPARK</h1><p>${txt('notice')}</p></div></div>
  <section class="panel preview-mode"><span class="eyebrow">${m?'MATCH IN PROGRESS':'SET UP A MATCH'}</span><h2>${m?(m.winner?(m.winner==='draw'?'DRAW':m.winner.toUpperCase()+' WINS!'):m.turn.toUpperCase()+"'S TURN"):'CONNECT THREE'}</h2>
  ${m?`<div class="preview-board">${m.cells.map((v,i)=>`<button aria-label="Cell ${i+1}" onclick="move(${i})">${v?(v==='x'?'✕':'◯'):'&nbsp;'}</button>`).join('')}</div>`:
  `<div class="big-orb" style="margin:30px auto">✦</div>`}<div class="button-row" style="justify-content:center;margin:20px auto">
   <button class="button primary" onclick="newMatch('bot')">${txt('bot')}</button><button class="button outline" onclick="newMatch('hotseat')">${txt('hotseat')}</button>
   ${m?'<button class="button ghost" onclick="undo()">↶ Undo</button>':''}</div>
   <p class="preview-info">Rules: alternate X/O in empty cells; form three marks along any row, column or diagonal.</p></section>`;}
 if(route==='profile')return `<div class="section-heading"><h1>${txt('profile')}</h1></div><section class="profile-banner panel"><div class="avatar-large">${data.profile.avatar}</div><div><span class="eyebrow">LOCAL PLAYER</span>
 <h2>${escapeName(data.profile.name)}</h2><p>LV ${Math.floor(data.profile.xp/150)+1} · ${data.profile.xp} XP · ${data.profile.chips} CHIPS</p></div></section>
 <section class="panel editor" style="margin-top:20px"><h2>${txt('profile')}</h2><label>${txt('name')}</label><input id="player-name" maxlength="24" value="${escapeName(data.profile.name)}">
 <div class="avatar-picker">${['☄','♛','✦','♥','☾','◆'].map(a=>`<button onclick="data.profile.avatar='${a}';persist();render()">${a}</button>`).join('')}</div>

 if(route==='settings')return `<div class="section-heading"><h1>${txt('settings')}</h1></div><section class="panel settings-panel"><h2>${txt('language')}</h2>

 <div class="settings-separator"></div><label class="switch-row">${txt('mute')}<input type="checkbox" ${data.settings.muted?'checked':''} onchange="data.settings.muted=this.checked;persist()"></label>
 <label class="switch-row">${txt('contrast')}<input type="checkbox" ${data.settings.contrast?'checked':''} onchange="data.settings.contrast=this.checked;persist();render()"></label>
 <button class="button outline" onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()">F11 FULLSCREEN</button><p>${txt('notice')}</p></section>`;
 return '';
}
function escapeName(n){return String(n).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}
function render(){document.documentElement.lang=data.settings.locale;
 document.getElementById('root').innerHTML=`<div class="app ${data.settings.contrast?'high-contrast':''}"><aside class="side-nav">
  <button class="brand-mark" onclick="go('home')">✦</button><div class="nav-divider"></div>
  ${[['home','◈'],['library','▦'],['trainer','✦'],['profile','♙'],['settings','⚙']].map(([r,ico])=>`<button class="nav-item ${route===r?'active':''}" onclick="go('${r}')"><span>${ico}</span><small>${txt(r)}</small></button>`).join('')}
  <div class="side-bottom"><span class="status-light"></span><small>OFFLINE</small></div></aside>
  <div class="shell"><header class="app-topbar"><div class="breadcrumb"><span class="brand-small">MASHUP <b>ARENA</b></span><span>/</span>${txt(route)}</div>

  <button class="profile-pill" onclick="go('profile')"><span>${data.profile.avatar}</span><b>${escapeName(data.profile.name)}</b></button></div></header>
  <main class="page">${content()}</main><footer class="shell-footer"><span>PHASE 2 · BROWSER REVIEW</span><span>${txt('status')} ●</span><span>VIRTUAL CHIPS ONLY</span></footer></div>
  ${detail?detailModal():''}</div>`;
}
function detailModal(){const g=catalog.find(x=>x.id===detail);if(!g)return '';

 <div class="detail-hero type-${g.category}"><span>${icons[g.id]||'✦'}</span><small>${g.category.toUpperCase()}</small></div><span class="eyebrow">DESIGN CATALOG · PHASE ${g.phase}</span><h2>${g.name}</h2>
 <p>${txt('notice')}</p><div class="mechanic-tags">${g.tags.map(x=>'<span>#'+x+'</span>').join('')}</div>
 <button class="button outline" onclick="toggle('${g.id}')">${data.profile.favs.includes(g.id)?'♥':'♡'} ${txt('favorites')}</button></section></div>`;}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){detail=null;route='home';render();}if(route==='trainer'&&e.key>='1'&&e.key<='9')move(Number(e.key)-1);
 if(e.key==='F11'){e.preventDefault();document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}});
