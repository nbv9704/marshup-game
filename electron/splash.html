<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'"><style>
*{box-sizing:border-box}body{margin:0;background:#0b1122;color:#f5f0e8;font-family:Segoe UI,Arial,sans-serif;display:grid;place-items:center;height:100vh}
body:before{content:'';position:absolute;inset:-20%;background:radial-gradient(circle at 20% 70%,#3c176a66,transparent 43%),radial-gradient(circle at 80% 20%,#18766a55,transparent 40%)}
main{position:relative;text-align:center}.symbol{font-size:72px;color:#49e3cb;text-shadow:0 0 26px #49e3cb77}.brand{font-size:31px;font-weight:900;letter-spacing:5px;margin:16px 0 7px}
small{letter-spacing:4px;color:#c3b6e9}.bar{width:160px;height:3px;background:#20304a;margin:30px auto;border-radius:4px;overflow:hidden}.bar:after{content:'';display:block;width:45%;height:100%;background:linear-gradient(90deg,#49e3cb,#ba91ff);animation:load 1.2s infinite alternate}@keyframes load{to{transform:translateX(140px)}}
</style></head><body><main><div class="symbol">✦</div><div class="brand">MASHUP ARENA</div><small>OFFLINE ARCADE</small><div class="bar"></div></main></body></html>
